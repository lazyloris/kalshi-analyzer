name: Hourly paper trade

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (GitHub may run it a few minutes late)
  workflow_dispatch: {}     # "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: paper-trader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect prices, paper trade, settle, update stats
        run: python -m kalshi_analyzer run
      - name: Save results to the repo
        run: |
          git config user.name "kalshi-paper-bot"
          git config user.email "kalshi-paper-bot@users.noreply.github.com"
          git add data dashboard/data reports
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "paper run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
