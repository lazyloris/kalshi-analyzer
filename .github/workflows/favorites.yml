name: Bitcoin favorites window

# The pre-registered favorite test enters about 4 hours before Bitcoin's 5pm ET close, i.e. 1pm ET.
# GitHub's cron is very unreliable here (on day one this job fired once, 3 hours late), so several
# start times are scheduled through the morning. Whichever run starts first WAITS until 1pm ET and
# then trades only the bitcoin_fav book; runs that start after the window just exit. The book's
# one-per-band cap means a second run in the window can't double up. Public repo: minutes are free.
on:
  schedule:
    - cron: "7 9-17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: favorites-window
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wait until 1pm ET (skip if the window has passed)
        id: wait
        run: |
          python - <<'PY'
          import datetime as dt, os, time
          from zoneinfo import ZoneInfo
          ny = ZoneInfo("America/New_York")
          now = dt.datetime.now(ny)
          target = now.replace(hour=13, minute=0, second=0, microsecond=0)
          wait = (target - now).total_seconds()
          go = -1800 <= wait <= 5.5 * 3600   # book trades 3.5-4.5h before the 5pm close
          print(f"now {now:%H:%M} ET, target 13:00, wait {wait / 60:.0f} min, go={go}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"go={'true' if go else 'false'}\n")
          if go and wait > 0:
              time.sleep(wait)
          PY
      - name: Paper trade the favorite book only
        if: steps.wait.outputs.go == 'true'
        run: |
          git pull --rebase || true
          python -m kalshi_analyzer run --books bitcoin_fav
      - name: Save results to the repo
        if: steps.wait.outputs.go == 'true'
        run: |
          git config user.name "kalshi-paper-bot"
          git config user.email "kalshi-paper-bot@users.noreply.github.com"
          git add -A data dashboard/data reports
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "favorites run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
