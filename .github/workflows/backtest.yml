name: Backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to test"
        default: "240"
      crypto_days:
        description: "History for Bitcoin/Ethereum (blank = 600 days)"
        default: ""
      weather_days:
        description: "Kalshi weather price history (blank = 600 days)"
        default: ""
  schedule:
    - cron: "40 9 * * 1"   # Mondays, after the weekend's markets settle
    - cron: "40 9 * * 4"   # Thursdays too: keeps the download cache from expiring (7 days unused)

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # first run downloads ~8 months; later runs only fetch new days
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore downloaded history
        uses: actions/cache/restore@v4
        with:
          path: data/backtest_cache
          key: backtest-cache-${{ github.run_id }}
          restore-keys: backtest-cache-
      - name: Fill gaps from the permanent copy (GitHub release "backtest-data")
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/backtest_cache
          if gh release download backtest-data -p backtest_cache.tar -D /tmp; then
            tar -xf /tmp/backtest_cache.tar --skip-old-files -C data   # keep newer cached files
            rm /tmp/backtest_cache.tar
          fi
          du -sh data/backtest_cache || true
      - name: Download new history
        if: github.event_name != 'push'
        run: python -m kalshi_analyzer.backtest fetch --days ${{ github.event.inputs.days || '240' }} --crypto-days ${{ github.event.inputs.crypto_days || '600' }} --weather-days ${{ github.event.inputs.weather_days || '600' }}
      - name: Download other price markets (Ethereum, gold, oil, S&P...)
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 130   # backstop; the script stops itself after --budget minutes and saves
        run: python -m kalshi_analyzer.backtest assets-fetch --budget 100 --days ${{ github.event.inputs.days || '240' }} --crypto-days ${{ github.event.inputs.crypto_days || '600' }}
      - name: Download market-scanner history
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m kalshi_analyzer.backtest scan-fetch
      - name: Save downloaded history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/backtest_cache
          key: backtest-cache-${{ github.run_id }}
      - name: Save permanent copy (GitHub release "backtest-data")
        if: ${{ !cancelled() && github.event_name != 'push' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -cf /tmp/backtest_cache.tar -C data backtest_cache
          ls -lh /tmp/backtest_cache.tar
          gh release view backtest-data >/dev/null 2>&1 || gh release create backtest-data --title "Backtest data (downloaded history)" --notes "Raw Kalshi, Coinbase and forecast history used by the backtest. Updated by the Backtest workflow; not a software release." --latest=false
          gh release upload backtest-data /tmp/backtest_cache.tar --clobber
      - name: Replay strategies
        if: ${{ !cancelled() && github.event_name != 'push' }}
        run: python -m kalshi_analyzer.backtest run
      - name: Market scanner
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m kalshi_analyzer.backtest scan-run
      - name: Price-level ladder test (per event)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python -m kalshi_analyzer.backtest ladder
      - name: Save results to the repo
        if: ${{ !cancelled() }}
        run: |
          git config user.name "kalshi-paper-bot"
          git config user.email "kalshi-paper-bot@users.noreply.github.com"
          git add dashboard/data/backtest.json reports/backtest.md
          git add dashboard/data/scanner.json reports/scanner.md 2>/dev/null || true
          git add dashboard/data/ladder.json reports/ladder.md 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "backtest $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
