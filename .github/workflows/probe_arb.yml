name: Probe Polymarket vs Kalshi

on:
  workflow_dispatch:
  push:
    branches: [arb-scan]
    paths: [kalshi_analyzer/probe_arb.py, .github/workflows/probe_arb.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m kalshi_analyzer.probe_arb
