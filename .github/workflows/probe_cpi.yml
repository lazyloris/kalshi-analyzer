name: Probe inflation markets

on:
  workflow_dispatch:
  push:
    branches: [cpi-test]
    paths: [kalshi_analyzer/probe_cpi.py, .github/workflows/probe_cpi.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m kalshi_analyzer.probe_cpi
