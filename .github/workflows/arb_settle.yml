name: Arb settle check
on:
  push:
    branches: [arb-settle]
    paths: [kalshi_analyzer/arb_settle.py, .github/workflows/arb_settle.yml]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m kalshi_analyzer.arb_settle
