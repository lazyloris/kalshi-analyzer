name: Probe Kalshi minute data

on:
  workflow_dispatch:
  push:
    branches: [wallet-study]
    paths: [kalshi_analyzer/probe_minute.py, .github/workflows/probe.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m kalshi_analyzer.probe_minute
